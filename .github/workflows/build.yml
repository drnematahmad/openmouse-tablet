name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the app files
        run: |
          cat > settings.gradle.kts <<'OPENMOUSE_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "OpenMouseTablet"
          include(":app")
          OPENMOUSE_EOF
          cat > build.gradle.kts <<'OPENMOUSE_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          OPENMOUSE_EOF
          cat > gradle.properties <<'OPENMOUSE_EOF'
          android.useAndroidX=false
          OPENMOUSE_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'OPENMOUSE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "org.openmouse.tablet"
              compileSdk = 35
              defaultConfig {
                  applicationId = "org.openmouse.tablet"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                  }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          OPENMOUSE_EOF
          mkdir -p app
          cat > app/proguard-rules.pro <<'OPENMOUSE_EOF'
          OPENMOUSE_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'OPENMOUSE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <application android:label="OpenMouse" android:allowBackup="false" android:theme="@android:style/Theme.DeviceDefault.DayNight">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          OPENMOUSE_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/device_filter.xml <<'OPENMOUSE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><usb-device vendor-id="1133" /></resources>
          OPENMOUSE_EOF
          mkdir -p app/src/main/java/org/openmouse/tablet
          cat > app/src/main/java/org/openmouse/tablet/Hidpp.kt <<'OPENMOUSE_EOF'
          package org.openmouse.tablet
          import android.hardware.usb.*
          interface Link {
              fun write(r: ByteArray)
              fun read(timeoutMs: Int): ByteArray?
              fun close()
          }
          class UsbLink(private val conn: UsbDeviceConnection, private val iface: UsbInterface, private val inEp: UsbEndpoint) : Link {
              private val buf = ByteArray(20)
              override fun write(r: ByteArray) { conn.controlTransfer(0x21, 0x09, (2 shl 8) or 0x11, iface.id, r, r.size, 500) }
              override fun read(timeoutMs: Int): ByteArray? { val n = conn.bulkTransfer(inEp, buf, buf.size, timeoutMs); return if (n > 0) buf.copyOf(n) else null }
              override fun close() { conn.releaseInterface(iface); conn.close() }
          }
          class Hidpp(private val link: Link) {
              private fun send(dev: Int, feat: Int, fn: Int, vararg p: Int) {
                  val r = ByteArray(20)
                  r[0] = 0x11; r[1] = dev.toByte(); r[2] = feat.toByte(); r[3] = ((fn shl 4) or 1).toByte()
                  p.forEachIndexed { i, v -> r[4 + i] = v.toByte() }
                  link.write(r)
              }
              fun call(dev: Int, feat: Int, fn: Int, vararg p: Int): ByteArray? {
                  send(dev, feat, fn, *p)
                  val end = System.currentTimeMillis() + 800
                  while (System.currentTimeMillis() < end) {
                      val buf = link.read(200) ?: continue
                      val n = buf.size
                      if (n < 20 || buf[0] != 0x11.toByte() || (buf[1].toInt() and 0xFF) != dev) continue
                      if (buf[2] == 0xFF.toByte()) return null // HID++ error reply
                      if (buf[2].toInt() == feat && (buf[3].toInt() shr 4) == fn) return buf.copyOfRange(4, 20)
                  }
                  return null
              }
              fun featureIndex(dev: Int, id: Int): Int {
                  val r = call(dev, 0, 0, id shr 8, id and 0xFF) ?: return 0
                  return r[0].toInt() and 0xFF
              }
              fun close() = link.close()
              companion object {
                  const val LOGITECH = 0x046d
                  fun open(mgr: UsbManager, d: UsbDevice): Hidpp? {
                      if (d.vendorId != LOGITECH) return null
                      var pick: UsbInterface? = null; var ep: UsbEndpoint? = null
                      for (i in 0 until d.interfaceCount) {
                          val itf = d.getInterface(i)
                          if (itf.interfaceClass != UsbConstants.USB_CLASS_HID) continue
                          for (e in 0 until itf.endpointCount) {
                              val x = itf.getEndpoint(e)
                              if (x.direction == UsbConstants.USB_DIR_IN && x.type == UsbConstants.USB_ENDPOINT_XFER_INT) { pick = itf; ep = x }
                          }
                      }
                      val c = mgr.openDevice(d) ?: return null
                      if (pick == null || ep == null || !c.claimInterface(pick, true)) { c.close(); return null }
                      return Hidpp(UsbLink(c, pick, ep))
                  }
              }
          }
          class MouseInfo(val dev: Int, val battery: Int?, val dpi: Int?, val dpiSteps: List
