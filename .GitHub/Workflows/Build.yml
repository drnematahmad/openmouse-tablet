name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the app files
        run: |
          cat > settings.gradle.kts <<'OPENMOUSE_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "OpenMouseTablet"
          include(":app")
          OPENMOUSE_EOF
          cat > build.gradle.kts <<'OPENMOUSE_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          OPENMOUSE_EOF
          cat > gradle.properties <<'OPENMOUSE_EOF'
          android.useAndroidX=false
          OPENMOUSE_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'OPENMOUSE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "org.openmouse.tablet"
              compileSdk = 35
              defaultConfig {
                  applicationId = "org.openmouse.tablet"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                  }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          // Deliberately no dependencies: no AndroidX, no Compose. Smaller app, less RAM.
          OPENMOUSE_EOF
          mkdir -p app
          cat > app/proguard-rules.pro <<'OPENMOUSE_EOF'
          # empty
          OPENMOUSE_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'OPENMOUSE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <application android:label="OpenMouse" android:allowBackup="false" android:theme="@android:style/Theme.DeviceDefault.DayNight">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          OPENMOUSE_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/device_filter.xml <<'OPENMOUSE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><usb-device vendor-id="1133" /></resources>
          OPENMOUSE_EOF
          mkdir -p app/src/main/java/org/openmouse/tablet
          cat > app/src/main/java/org/openmouse/tablet/Hidpp.kt <<'OPENMOUSE_EOF'
          package org.openmouse.tablet

          import android.hardware.usb.*

          /**
           * Minimal HID++ 2.0 client over a Logitech USB receiver (Bolt / Unifying / Lightspeed).
           * Protocol details (report 0x11, feature IDs 0x1004 / 0x2201 / 0x2110) follow OpenLogi's
           * openlogi-hidpp crate. Opened on demand and closed immediately: nothing runs in the background.
           */
          interface Link {
              fun write(r: ByteArray)
              fun read(timeoutMs: Int): ByteArray?
              fun close()
          }

          class UsbLink(private val conn: UsbDeviceConnection, private val iface: UsbInterface, private val inEp: UsbEndpoint) : Link {
              private val buf = ByteArray(20)
              // HID SET_REPORT (output report id 0x11) on the HID++ interface
              override fun write(r: ByteArray) { conn.controlTransfer(0x21, 0x09, (2 shl 8) or 0x11, iface.id, r, r.size, 500) }
              override fun read(timeoutMs: Int): ByteArray? { val n = conn.bulkTransfer(inEp, buf, buf.size, timeoutMs); return if (n > 0) buf.copyOf(n) else null }
              override fun close() { conn.releaseInterface(iface); conn.close() }
          }

          class Hidpp(private val link: Link) {

              private fun send(dev: Int, feat: Int, fn: Int, vararg p: Int) {
                  val r = ByteArray(20)
                  r[0] = 0x11; r[1] = dev.toByte(); r[2] = feat.toByte(); r[3] = ((fn shl 4) or 1).toByte()
                  p.forEachIndexed { i, v -> r[4 + i] = v.toByte() }
                  link.write(r)
              }

              /** Returns the 16-byte payload of the matching reply, or null on timeout / error. */
              fun call(dev: Int, feat: Int, fn: Int, vararg p: Int): ByteArray? {
                  send(dev, feat, fn, *p)
                  val end = System.currentTimeMillis() + 800
                  while (System.currentTimeMillis() < end) {
                      val buf = link.read(200) ?: continue
                      val n = buf.size
                      if (n < 20 || buf[0] != 0x11.toByte() || (buf[1].toInt() and 0xFF) != dev) continue
                      if (buf[2] == 0xFF.toByte()) return null // HID++ error reply
                      if (buf[2].toInt() == feat && (buf[3].toInt() shr 4) == fn) return buf.copyOfRange(4, 20)
                  }
                  return null
              }

              fun featureIndex(dev: Int, id: Int): Int {
                  val r = call(dev, 0, 0, id shr 8, id and 0xFF) ?: return 0
                  return r[0].toInt() and 0xFF
              }

              fun close() = link.close()

              companion object {
                  const val LOGITECH = 0x046d
                  fun open(mgr: UsbManager, d: UsbDevice): Hidpp? {
                      if (d.vendorId != LOGITECH) return null
                      // The HID++ interface is the last HID interface that has an interrupt-IN endpoint.
                      var pick: UsbInterface? = null; var ep: UsbEndpoint? = null
                      for (i in 0 until d.interfaceCount) {
                          val itf = d.getInterface(i)
                          if (itf.interfaceClass != UsbConstants.USB_CLASS_HID) continue
                          for (e in 0 until itf.endpointCount) {
                              val x = itf.getEndpoint(e)
                              if (x.direction == UsbConstants.USB_DIR_IN && x.type == UsbConstants.USB_ENDPOINT_XFER_INT) { pick = itf; ep = x }
                          }
                      }
                      val c = mgr.openDevice(d) ?: return null
                      if (pick == null || ep == null || !c.claimInterface(pick, true)) { c.close(); return null }
                      return Hidpp(UsbLink(c, pick, ep))
                  }
              }
          }

          /** What we show for one paired mouse. */
          class MouseInfo(val dev: Int, val battery: Int?, val dpi: Int?, val dpiSteps: List<Int>, val ratchet: Boolean?)

          fun readMouse(h: Hidpp, dev: Int): MouseInfo? {
              val dpiIdx = h.featureIndex(dev, 0x2201)
              val batIdx = h.featureIndex(dev, 0x1004)
              val ssIdx = h.featureIndex(dev, 0x2110)
              if (dpiIdx == 0 && batIdx == 0 && ssIdx == 0) return null
              val bat = if (batIdx != 0) h.call(dev, batIdx, 1)?.get(0)?.toInt()?.and(0xFF) else null
              var dpi: Int? = null; var steps = emptyList<Int>()
              if (dpiIdx != 0) {
                  h.call(dev, dpiIdx, 2, 0, 0, 0)?.let { dpi = ((it[1].toInt() and 0xFF) shl 8) or (it[2].toInt() and 0xFF) }
                  h.call(dev, dpiIdx, 1, 0, 0, 0)?.let { steps = parseDpiList(it) }
              }
              val ratchet = if (ssIdx != 0) h.call(dev, ssIdx, 0)?.let { it[0].toInt() == 2 } else null
              return MouseInfo(dev, bat, dpi, steps, ratchet)
          }

          fun setDpi(h: Hidpp, dev: Int, dpi: Int): Boolean {
              val i = h.featureIndex(dev, 0x2201); if (i == 0) return false
              return h.call(dev, i, 3, 0, dpi shr 8, dpi and 0xFF) != null
          }

          fun setRatchet(h: Hidpp, dev: Int, ratchet: Boolean): Boolean {
              val i = h.featureIndex(dev, 0x2110); if (i == 0) return false
              return h.call(dev, i, 1, if (ratchet) 2 else 1) != null
          }

          /** DPI list: explicit values, or a range written as [min, 0xE000|step, max]; 0x0000 ends it. */
          fun parseDpiList(p: ByteArray): List<Int> {
              val v = ArrayList<Int>()
              var i = 1
              while (i + 1 < p.size) {
                  val x = ((p[i].toInt() and 0xFF) shl 8) or (p[i + 1].toInt() and 0xFF)
                  if (x == 0) break
                  v.add(x); i += 2
              }
              val r = v.indexOfFirst { it and 0xE000 == 0xE000 }
              if (r > 0 && r + 1 < v.size) {
                  val step = v[r] and 0x1FFF
                  return (v[r - 1]..v[r + 1] step step.coerceAtLeast(50)).toList()
              }
              return v
          }
          OPENMOUSE_EOF
          mkdir -p app/src/main/java/org/openmouse/tablet
          cat > app/src/main/java/org/openmouse/tablet/BleLink.kt <<'OPENMOUSE_EOF'
          package org.openmouse.tablet

          import android.annotation.SuppressLint
          import android.bluetooth.*
          import android.content.Context
          import java.util.UUID
          import java.util.concurrent.LinkedBlockingQueue
          import java.util.concurrent.TimeUnit

          /**
           * HID++ over Bluetooth LE. Logitech mice expose a private GATT service for it:
           * write 20-byte reports to the characteristic, replies arrive as notifications.
           * Direct Bluetooth devices use device index 0xFF.
           */
          @SuppressLint("MissingPermission")
          class BleLink private constructor(private val gatt: BluetoothGatt, private val ch: BluetoothGattCharacteristic, private val q: LinkedBlockingQueue<ByteArray>) : Link {
              override fun write(r: ByteArray) {
                  ch.writeType = BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                  gatt.writeCharacteristic(ch, r, BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE)
              }
              override fun read(timeoutMs: Int): ByteArray? = q.poll(timeoutMs.toLong(), TimeUnit.MILLISECONDS)
              override fun close() { gatt.disconnect(); gatt.close() }

              companion object {
                  val SERVICE: UUID = UUID.fromString("00010000-0000-1000-8000-011f2000046d")
                  val CHAR: UUID = UUID.fromString("00010001-0000-1000-8000-011f2000046d")
                  val CCCD: UUID = UUID.fromString("00002902-0000-1000-8000-00805f9b34fb")

                  /** Blocking: call from a worker thread. Returns null if the mouse can't be reached. */
                  fun open(ctx: Context, dev: BluetoothDevice): BleLink? {
                      val q = LinkedBlockingQueue<ByteArray>()
                      val ready = LinkedBlockingQueue<Int>()
                      var found: BluetoothGattCharacteristic? = null
                      val cb = object : BluetoothGattCallback() {
                          override fun onConnectionStateChange(g: BluetoothGatt, st: Int, ns: Int) {
                              if (ns == BluetoothProfile.STATE_CONNECTED) g.discoverServices() else ready.offer(-1)
                          }
                          override fun onServicesDiscovered(g: BluetoothGatt, st: Int) {
                              found = g.getService(SERVICE)?.getCharacteristic(CHAR)
                              val c = found ?: return run { ready.offer(-1) }
                              g.setCharacteristicNotification(c, true)
                              val d = c.getDescriptor(CCCD) ?: return run { ready.offer(-1) }
                              g.writeDescriptor(d, BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE)
                          }
                          override fun onDescriptorWrite(g: BluetoothGatt, d: BluetoothGattDescriptor, st: Int) { ready.offer(if (st == 0) 1 else -1) }
                          override fun onCharacteristicChanged(g: BluetoothGatt, c: BluetoothGattCharacteristic, v: ByteArray) { q.offer(v) }
                      }
                      val g = dev.connectGatt(ctx, false, cb, BluetoothDevice.TRANSPORT_LE)
                      val ok = ready.poll(8, TimeUnit.SECONDS) == 1
                      val c = found
                      if (!ok || c == null) { g.disconnect(); g.close(); return null }
                      return BleLink(g, c, q)
                  }
              }
          }
          OPENMOUSE_EOF
          mkdir -p app/src/main/java/org/openmouse/tablet
          cat > app/src/main/java/org/openmouse/tablet/MainActivity.kt <<'OPENMOUSE_EOF'
          package org.openmouse.tablet

          import android.app.Activity
          import android.app.PendingIntent
          import android.content.*
          import android.hardware.usb.*
          import android.os.Bundle
          import android.widget.*

          /**
           * One screen, plain framework views (no Compose, no AndroidX), no services, no polling.
           * Talks to the mouse only while visible; the USB link is released in onPause.
           */
          class MainActivity : Activity() {
              private lateinit var mgr: UsbManager
              private lateinit var box: LinearLayout
              private var hid: Hidpp? = null
              private val perm = "org.openmouse.tablet.USB"

              private val rx = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) { refresh() }
              }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  mgr = getSystemService(USB_SERVICE) as UsbManager
                  val sv = ScrollView(this)
                  box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 48, 48, 48) }
                  sv.addView(box); setContentView(sv)
              }

              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) { refresh() }

              override fun onResume() {
                  super.onResume()
                  val f = IntentFilter(perm).apply { addAction(UsbManager.ACTION_USB_DEVICE_ATTACHED); addAction(UsbManager.ACTION_USB_DEVICE_DETACHED) }
                  registerReceiver(rx, f, RECEIVER_NOT_EXPORTED)
                  refresh()
              }

              override fun onPause() {
                  unregisterReceiver(rx); hid?.close(); hid = null
                  super.onPause()
              }

              private fun say(t: String) { box.removeAllViews(); box.addView(TextView(this).apply { text = t; textSize = 18f }) }

              private fun refresh() {
                  hid?.close(); hid = null
                  if (checkSelfPermission(android.Manifest.permission.BLUETOOTH_CONNECT) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(android.Manifest.permission.BLUETOOTH_CONNECT), 1); return say("Allow Bluetooth access.")
                  }
                  val bt = (getSystemService(BLUETOOTH_SERVICE) as android.bluetooth.BluetoothManager).adapter
                  val mouse = bt?.bondedDevices?.firstOrNull { it.name?.contains("MX", true) == true || it.name?.contains("Logi", true) == true }
                  if (mouse != null) {
                      say("Connecting to ${mouse.name}...")
                      Thread {
                          val link = BleLink.open(this, mouse)
                          if (link == null) runOnUiThread { say("Couldn't reach ${mouse.name} over Bluetooth. Make sure it's on and connected to this tablet.") }
                          else { val h = Hidpp(link); hid = h; val m = readMouse(h, 0xFF); runOnUiThread { if (m == null) say("Connected, but the mouse didn't answer.") else show(h, listOf(m)) } }
                      }.start()
                      return
                  }
                  val d = mgr.deviceList.values.firstOrNull { it.vendorId == Hidpp.LOGITECH }
                      ?: return say("Plug your Logitech receiver into the tablet's USB-C port (an adapter may be needed).")
                  if (!mgr.hasPermission(d)) {
                      mgr.requestPermission(d, PendingIntent.getBroadcast(this, 0, Intent(perm).setPackage(packageName), PendingIntent.FLAG_MUTABLE))
                      return say("Allow USB access for the receiver.")
                  }
                  val h = Hidpp.open(mgr, d) ?: return say("Could not open the receiver's HID++ channel.")
                  hid = h
                  Thread {
                      val mice = (1..6).mapNotNull { runCatching { readMouse(h, it) }.getOrNull() }
                      runOnUiThread { show(h, mice) }
                  }.start()
              }

              private fun show(h: Hidpp, mice: List<MouseInfo>) {
                  if (mice.isEmpty()) return say("Receiver found, but no paired mouse answered. Wake the mouse and reopen.")
                  box.removeAllViews()
                  for (m in mice) {
                      box.addView(TextView(this).apply { text = "Mouse ${m.dev}   battery: ${m.battery?.let { "$it%" } ?: "n/a"}"; textSize = 20f })
                      if (m.dpi != null && m.dpiSteps.isNotEmpty()) {
                          val lab = TextView(this).apply { text = "DPI: ${m.dpi}" }
                          val bar = SeekBar(this).apply {
                              max = m.dpiSteps.size - 1
                              progress = m.dpiSteps.indexOfFirst { it >= m.dpi }.coerceAtLeast(0)
                              setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                                  override fun onProgressChanged(s: SeekBar, p: Int, u: Boolean) { lab.text = "DPI: ${m.dpiSteps[p]}" }
                                  override fun onStartTrackingTouch(s: SeekBar) {}
                                  override fun onStopTrackingTouch(s: SeekBar) { val v = m.dpiSteps[s.progress]; Thread { setDpi(h, m.dev, v) }.start() }
                              })
                          }
                          box.addView(lab); box.addView(bar)
                      }
                      if (m.ratchet != null) {
                          box.addView(Switch(this).apply {
                              text = "Scroll wheel ratchet (off = free-spin)"; isChecked = m.ratchet
                              setOnCheckedChangeListener { _, on -> Thread { setRatchet(h, m.dev, on) }.start() }
                          })
                      }
                  }
              }
          }
          OPENMOUSE_EOF
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: and
